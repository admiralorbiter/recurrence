[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recurrence"
version = "0.1.0"
description = "Research program investigating persistent recurrent state, endogenous regulation, and developmental continuity."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Recurrence Research Program" }
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "duckdb>=0.9.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
