[package]
name = "continuity_garden_core"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rayon = "1.10"

[[bin]]
name = "q10_runner"
path = "src/bin/q10_runner.rs"

[[bin]]
name = "run_q10b_rust"
path = "src/bin/run_q10b_rust.rs"

[[bin]]
name = "reservoir_census"
path = "src/bin/reservoir_census.rs"

[[bin]]
name = "run_q10c_experiment"
path = "src/bin/run_q10c_experiment.rs"

[[bin]]
name = "run_q10d_experiment"
path = "src/bin/run_q10d_experiment.rs"

[[bin]]
name = "temporal_capacity_map"
path = "src/bin/temporal_capacity_map.rs"
